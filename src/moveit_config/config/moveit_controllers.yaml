# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - LEG1_controller
    - LEG2_controller
    - LEG3_controller
    - LEG4_controller
    - LEG5_controller
    - LEG6_controller


  LEG1_controller:
    type: FollowJointTrajectory
    joints:
      - 1A_joint
      - 1B_joint
      - 1C_joint
    action_ns: follow_joint_trajectory
  LEG2_controller:
    type: FollowJointTrajectory
    joints:
      - 2A_joint
      - 2B_joint
      - 2C_joint
    action_ns: follow_joint_trajectory
  LEG3_controller:
    type: FollowJointTrajectory
    joints:
      - 3A_joint
      - 3B_joint
      - 3C_joint
    action_ns: follow_joint_trajectory
  LEG4_controller:
    type: FollowJointTrajectory
    joints:
      - 4A_joint
      - 4B_joint
      - 4C_joint
    action_ns: follow_joint_trajectory
  LEG5_controller:
    type: FollowJointTrajectory
    joints:
      - 5A_joint
      - 5B_joint
      - 5C_joint
    action_ns: follow_joint_trajectory
  LEG6_controller:
    type: FollowJointTrajectory
    joints:
      - 6A_joint
      - 6B_joint
      - 6C_joint
    action_ns: follow_joint_trajectory
