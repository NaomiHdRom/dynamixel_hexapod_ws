      - joint_3A
      - joint_3B
      - joint_3C
    command_interfaces:
      - position
    state_interfaces:
      - position
     

LEG4_controller:
  ros__parameters:
    joints:
      - joint_4A
      - joint_4B
      - joint_4C
    command_interfaces:
      - position
    state_interfaces:
      - position
     

LEG5_controller:
  ros__parameters:
    joints:
      - joint_5A
      - joint_5B
      - joint_5C
    command_interfaces:
      - position
    state_interfaces:
